# Open-weight models served locally, one entry per model *and quantisation*.
#
# `endpoint_model` is the name the inference server serves; runs call each server directly
# (see models/providers.yaml). `efforts` maps each reasoning-effort label to the exact
# request-body fields that select it on that server (vLLM/SGLang read chat_template_kwargs;
# MTPLX and Splash read a top-level reasoning_effort); labels follow each vendor's own
# vocabulary, and `effort_tiers` maps them onto a common off/low/medium/high/max scale. A plain
# thinking switch (efforts "off" and "on" only) maps "on" to the tier "on": thinking at the model's
# own default depth is not a level on that scale (docs/methodology.md, section 4).
# Sampling follows each vendor's recommendation for thinking mode.
# `hardware` is what the configuration is served on (accelerator model and count, or computer
# model and memory): a hardware model, never a machine's name. Unset while unknown.

models:
  # ---------------------------------------------------------------- Qwen3.8 27B (dense)
  - id: qwen3.8-27b-awq-int4
    provider: direct-qwen27b
    endpoint_model: qwen3.8-27b
    proxy_model: qwen3.8-27b
    display: Qwen3.8 27B
    model_id: qwen3-8-27b
    developer: qwen
    family: Qwen3.8
    base_model: Qwen3.8-27B
    quant: AWQ-INT4
    engine: vLLM
    hardware: 1× NVIDIA GeForce RTX 5090 (32 GB)
    context: 163840
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20}
    default_effort: medium
    efforts:
      low: {chat_template_kwargs: {reasoning_effort: low}}
      medium: {chat_template_kwargs: {reasoning_effort: medium}}
      xhigh: {chat_template_kwargs: {reasoning_effort: xhigh}}
    effort_tiers: {low: low, medium: medium, xhigh: max}

  - id: qwen3.8-27b-mlx-4bit
